<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage States/Provinces - License Plate Game</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="container mt-3">
                <div class="alert alert-info">
                    {% for message in messages %}
                        <p class="mb-0">{{ message }}</p>
                    {% endfor %}
                </div>
            </div>
        {% endif %}
    {% endwith %}

    <div class="container mt-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
            <h1 class="mb-3 mb-md-0">Manage States/Provinces</h1>
            <div>
                <a href="{{ url_for('admin') }}" class="btn btn-secondary">Back to Admin</a>
                <a href="{{ url_for('user_page') }}" class="btn btn-primary">Back to App</a>
            </div>
        </div>

        <form method="POST" class="bg-white p-4 shadow-sm rounded">
            <table class="table table-striped table-responsive-sm">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Rename</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for state in states %}
                        <tr>
                            <td>{{ state.name }}</td>
                            <td>
                                <input type="text" class="form-control" name="state_name" value="{{ state.name }}">
                            </td>
                            <td>
                                <button type="submit" name="state_id" value="{{ state.id }}" class="btn btn-sm btn-primary" formmethod="POST" formaction="{{ url_for('manage_states') }}">
                                    Update
                                </button>
                                <button type="submit" name="state_id" value="{{ state.id }}" class="btn btn-sm btn-danger" formmethod="POST" formaction="{{ url_for('manage_states') }}">
                                    Delete
                                </button>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </form>
    </div>
</body>
</html>
