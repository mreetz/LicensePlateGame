<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage States/Provinces</title>
</head>
<body>
    <!-- Flash Message Section (Display flash messages here) -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-info">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    <h1>Manage States/Provinces</h1>

    <h2>States/Provinces</h2>
    <form method="POST">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for state in states %}
                    <tr>
                        <td>{{ state.name }}</td>
                        <td>
                            <button type="submit" name="state_id" value="{{ state.id }}" formmethod="POST" formaction="{{ url_for('manage_states') }}">
                                Delete
                            </button>
                            <input type="text" name="state_name" value="{{ state.name }}">
                            <button type="submit" name="state_id" value="{{ state.id }}" formmethod="POST" formaction="{{ url_for('manage_states') }}">
                                Update
                            </button>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </form>
</body>
</html>
